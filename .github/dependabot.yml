version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    ignore:
      # These tags select the Rust version, not the action version.
      - dependency-name: dtolnay/rust-toolchain
